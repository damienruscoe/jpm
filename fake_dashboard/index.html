	<script>
		/*
		var canvas = document.getElementById('canvas');
		var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
		if (gl) {
			console.log("DOM WebGL Success! Renderer:", gl.getParameter(gl.RENDERER));
		} else {
			console.error("DOM WebGL Failed!");
		}
		*/

    var canvasEl = document.getElementById('canvas');

		var Module = typeof Module !== 'undefined' ? Module : {};
		Module.canvas = canvasEl;

		Module.preRun = Module.preRun || [];
		Module.preRun.push(function() {
			console.log("[JS PRE-RUN] Started");
			if (typeof Browser !== 'undefined' && Browser.createContext) {
				var origCreateContext = Browser.createContext;
				Browser.createContext = function(canvas, useWebGL, setInModule, webGLContextAttributes) {
					webGLContextAttributes = webGLContextAttributes || {};
					webGLContextAttributes.majorVersion = 1; // Explicitly override line 6607
					return origCreateContext(canvas, useWebGL, setInModule, webGLContextAttributes);
				};
				console.log("[JS PRE-RUN] Patched Browser.createContext to enforce WebGL 1");
			}
			console.log("[JS PRE-RUN] Finished");
		});

    // Intercept Emscripten's webgl2 context request and downgrade it to webgl/experimental-webgl
    var originalGetContext = canvasEl.getContext.bind(canvasEl);
    canvasEl.getContext = function(type, attributes) {
			console.log("[HOOK] GLFW requested context type:", type);
			console.log("[HOOK] Attributes passed by GLFW:", JSON.stringify(attributes));

			var targetType = (type === 'webgl2') ? 'webgl' : type;

			var forcedAttributes = attributes || {};
			forcedAttributes.majorVersion = 1;
			forcedAttributes.minorVersion = 0;
			forcedAttributes.alpha = false;        // Mali-450 often fails with alpha: true
			forcedAttributes.stencil = false;      // Disable stencil unless ImGui explicitly requires it
			forcedAttributes.depth = true;
			forcedAttributes.antialias = false;
			forcedAttributes.powerPreference = "low-power";
			forcedAttributes.failIfMajorPerformanceCaveat = false; //

			console.log("[HOOK] Forced attributes being passed to originalGetContext:", JSON.stringify(forcedAttributes));
			var ctx = originalGetContext(targetType, forcedAttributes);

			if (ctx) {
				console.log("[HOOK] SUCCESS: Context acquired for type:", targetType);
			} else {
				console.error("[HOOK] FAILED: getContext returned null for type:", targetType);

				// Fallback probe: try fetching basic experimental-webgl
				var fallbackCtx = originalGetContext('experimental-webgl');
				console.log("[HOOK] Fallback 'experimental-webgl' result:", fallbackCtx ? "SUCCESS" : "FAILED");
			}

      return ctx;
    };

    var Module = {
      canvas: canvasEl,
      devicePixelRatio: 1
    };
  </script>
